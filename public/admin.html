<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pcverse · Inbox</title>
<link rel="icon" type="image/png" href="logo-dark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbfbfd;--bg-2:#f5f5f7;--card:#ffffff;
  --ink:#0a0a0c;--ink-2:#1d1d1f;--muted:#6e6e73;--muted-2:#a1a1a6;
  --line:rgba(0,0,0,.08);--line-hi:rgba(0,0,0,.14);
  --accent:#0a84ff;--accent-soft:rgba(10,132,255,.08);--verified:#1db954;--danger:#e0245e;
  --radius:20px;--display:'Fraunces',Georgia,serif;--body:'Manrope',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink-2);font-family:var(--body);-webkit-font-smoothing:antialiased;line-height:1.55}
.hidden{display:none!important}

.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:38px 30px;width:100%;max-width:380px;box-shadow:0 24px 60px -30px rgba(0,0,0,.25)}
.login-logo{text-align:center;margin-bottom:6px}.login-logo img{height:40px}
.login-card h1{font-family:var(--display);font-weight:600;font-size:1.7rem;letter-spacing:-.02em;color:var(--ink);text-align:center;margin-bottom:4px}
.login-card .sub{text-align:center;color:var(--muted);font-size:.9rem;margin-bottom:26px}
.field{margin-bottom:14px}.field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:13px 15px;font-family:var(--body);font-size:1rem;color:var(--ink);transition:.2s}
.field input:focus{outline:none;border-color:var(--accent);background:var(--card)}
.btn-primary{width:100%;background:var(--ink);color:#fff;border:none;border-radius:999px;padding:14px;font-family:var(--body);font-size:1rem;font-weight:700;cursor:pointer;transition:.22s;margin-top:8px}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}
.btn-primary:disabled{opacity:.5;transform:none;box-shadow:none}
.err{color:var(--danger);font-size:.86rem;font-weight:600;margin-top:12px;min-height:18px;text-align:center}

.topbar{position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(20px);background:rgba(251,251,253,.8);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;height:58px;display:flex;align-items:center;gap:12px;padding:0 18px}
.topbar .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.1rem;letter-spacing:-.03em;color:var(--ink);text-decoration:none}
.topbar .brand img{height:24px}
.topbar .tag{font-family:var(--body);font-weight:600;font-size:.78rem;color:var(--muted);border-left:1px solid var(--line-hi);padding-left:12px}
.topbar .unread-total{background:var(--danger);color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;min-width:20px;text-align:center}
.topbar .back{font-size:1.5rem;color:var(--ink);cursor:pointer;background:none;border:none;padding:0 4px 0 0}
.topbar .peer{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.92rem;color:var(--ink)}
.topbar .logout{margin-left:auto;background:none;border:1px solid var(--line-hi);border-radius:999px;padding:7px 14px;font-family:var(--body);font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.2s}
.topbar .logout:hover{color:var(--ink);border-color:var(--ink)}
.ai-toggle{margin-left:auto;border:none;border-radius:999px;padding:8px 15px;font-family:var(--body);font-weight:700;font-size:.82rem;cursor:pointer;transition:.2s;white-space:nowrap}
.ai-toggle.off{background:var(--ink);color:#fff}.ai-toggle.on{background:var(--accent-soft);color:var(--accent)}
.shell{max-width:760px;margin:0 auto;padding:0 18px}

.list-head{font-family:var(--display);font-weight:600;font-size:1.5rem;letter-spacing:-.02em;color:var(--ink);padding:22px 2px 12px}
.search{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 15px;font-family:var(--body);font-size:.95rem;color:var(--ink);margin-bottom:12px}
.search:focus{outline:none;border-color:var(--accent)}
.filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.chip{border:1px solid var(--line-hi);background:var(--card);border-radius:999px;padding:7px 14px;font-family:var(--body);font-weight:600;font-size:.82rem;color:var(--muted);cursor:pointer;transition:.2s}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.conv{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.22s cubic-bezier(.2,.7,.3,1)}
.conv:hover{transform:translateY(-2px);box-shadow:0 16px 34px -22px rgba(0,0,0,.3);border-color:var(--line-hi)}
.conv .avatar{flex:0 0 44px;width:44px;height:44px;border-radius:50%;background:var(--bg-2);display:flex;align-items:center;justify-content:center;font-size:1.15rem}
.conv .meta{flex:1;min-width:0}
.conv .num{font-weight:700;font-size:.96rem;color:var(--ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.conv .prev{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.conv .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:0 0 auto}
.conv .time{font-size:.74rem;color:var(--muted-2);white-space:nowrap}
.unread{background:var(--danger);color:#fff;font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;min-width:20px;text-align:center}
.pill{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.pill-paused{background:var(--accent-soft);color:var(--accent)}
.pill-paused .pulse{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 2.4s infinite}
.pill-closed{background:rgba(0,0,0,.06);color:var(--muted)}
.pill-important{background:rgba(224,36,94,.1);color:var(--danger)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(10,132,255,.45)}70%{box-shadow:0 0 0 7px rgba(10,132,255,0)}100%{box-shadow:0 0 0 0 rgba(10,132,255,0)}}
.empty{text-align:center;color:var(--muted);font-size:.95rem;padding:60px 20px}.empty .ico{font-size:2.4rem;margin-bottom:12px;opacity:.5}

.actionbar{max-width:760px;margin:0 auto;display:flex;gap:8px;padding:12px 18px 0;flex-wrap:wrap}
.act{border:1px solid var(--line-hi);background:var(--card);border-radius:999px;padding:7px 13px;font-family:var(--body);font-weight:600;font-size:.8rem;color:var(--muted);cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:5px}
.act:hover{color:var(--ink);border-color:var(--ink)}
.act.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.act.danger:hover{color:var(--danger);border-color:var(--danger)}
.msgs{padding:14px 2px 120px;display:flex;flex-direction:column;gap:3px}
.msg-row{display:flex;flex-direction:column;margin-bottom:7px}
.msg-row.user{align-items:flex-start}.msg-row.assistant{align-items:flex-end}
.bubble{max-width:80%;padding:11px 15px;font-size:.96rem;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.msg-row.user .bubble{background:var(--card);border:1px solid var(--line);color:var(--ink-2);border-radius:18px 18px 18px 5px}
.msg-row.assistant .bubble{background:var(--ink);color:#fff;border-radius:18px 18px 5px 18px}
.stamp{font-size:.7rem;color:var(--muted-2);margin:3px 4px 0}
.composer{position:fixed;bottom:0;left:0;right:0;background:rgba(251,251,253,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:12px}
.composer-in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:flex-end}
.composer textarea{flex:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 16px;font-family:var(--body);font-size:1rem;color:var(--ink);resize:none;height:46px;max-height:120px}
.composer textarea:focus{outline:none;border-color:var(--accent)}
.composer .send{flex:0 0 auto;background:var(--ink);color:#fff;border:none;border-radius:999px;width:46px;height:46px;font-size:1.2rem;cursor:pointer}
.composer .send:disabled{opacity:.5}
.statusline{max-width:760px;margin:0 auto;padding:8px 18px 0;font-size:.8rem;font-weight:600;color:var(--muted)}
.statusline .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.statusline.active .dot{background:var(--verified)}.statusline.frozen .dot{background:var(--accent)}
</style>
</head>
<body>

<div id="login" class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><img src="logo-dark.png" alt="Pcverse" onerror="this.style.display='none'"></div>
    <h1>Inbox</h1><div class="sub">Πίνακας συνομιλιών Pcverse</div>
    <div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div>
    <div class="field"><label>Κωδικός</label><input id="password" type="password" autocomplete="current-password"></div>
    <button id="loginBtn" class="btn-primary">Σύνδεση</button>
    <div id="loginErr" class="err"></div>
  </div>
</div>

<div id="listView" class="hidden">
  <div class="topbar"><div class="topbar-in">
    <a class="brand"><img src="logo-dark.png" alt="" onerror="this.style.display='none'">Pcverse</a>
    <span class="tag">Inbox</span>
    <span id="unreadTotal" class="unread-total hidden"></span>
    <button class="logout" onclick="logout()">Έξοδος</button>
  </div></div>
  <div class="shell">
    <div class="list-head">Συνομιλίες</div>
    <input id="search" class="search" placeholder="🔍 Αναζήτηση…" oninput="renderList()">
    <div class="filters">
      <button class="chip active" data-f="all" onclick="setFilter('all')">Όλες</button>
      <button class="chip" data-f="wa" onclick="setFilter('wa')">💬 WhatsApp</button>
      <button class="chip" data-f="web" onclick="setFilter('web')">🌐 Site</button>
      <button class="chip" data-f="unread" onclick="setFilter('unread')">🔴 Μη αναγνωσμένες</button>
      <button class="chip" data-f="closed" onclick="setFilter('closed')">✓ Κλεισμένες</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<div id="chatView" class="hidden">
  <div class="topbar"><div class="topbar-in">
    <button class="back" onclick="closeChat()">‹</button>
    <span class="peer" id="chatTitle"></span>
    <button class="ai-toggle" id="aiToggle" onclick="toggleAI()"></button>
  </div></div>
  <div class="actionbar">
    <button class="act" id="tagOpen" onclick="setTag('open')">📂 Ανοιχτή</button>
    <button class="act" id="tagClosed" onclick="setTag('closed')">✓ Κλείσε</button>
    <button class="act" id="tagImportant" onclick="setTag('important')">⭐ Σημαντική</button>
    <button class="act danger" onclick="delChat()">🗑️ Διαγραφή</button>
  </div>
  <div id="statusLine" class="statusline"></div>
  <div class="shell"><div id="msgs" class="msgs"></div></div>
  <div class="composer"><div class="composer-in">
    <textarea id="reply" placeholder="Γράψε απάντηση…" oninput="autosize(this)"></textarea>
    <button class="send" id="sendBtn" onclick="sendReply()">↑</button>
  </div></div>
</div>

<script>
const API="/.netlify/functions/admin";
let KEY=sessionStorage.getItem("pv_key")||"";
let current=null,listTimer=null,chatTimer=null,curState={ai_enabled:true,paused_until:null,tag:"open"};
let allConvos=[],filter="all";

function show(id){["login","listView","chatView"].forEach(v=>document.getElementById(v).classList.toggle("hidden",v!==id));}
function autosize(t){t.style.height="46px";t.style.height=Math.min(t.scrollHeight,120)+"px";}

document.getElementById("loginBtn").onclick=async()=>{
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const btn=document.getElementById("loginBtn");btn.disabled=true;document.getElementById("loginErr").textContent="";
  try{const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"login",email,password})});
    const d=await r.json();
    if(d.ok){KEY=password;sessionStorage.setItem("pv_key",KEY);openList();}
    else document.getElementById("loginErr").textContent=d.error||"Αποτυχία";
  }catch{document.getElementById("loginErr").textContent="Σφάλμα σύνδεσης";}
  btn.disabled=false;
};
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("loginBtn").click();});

async function api(path,opts={}){opts.headers=Object.assign({"x-admin-key":KEY},opts.headers||{});const r=await fetch(API+path,opts);if(r.status===401){logout();throw new Error("auth");}return r.json();}
function logout(){sessionStorage.removeItem("pv_key");KEY="";clearInterval(listTimer);clearInterval(chatTimer);show("login");}

function fmtNum(n){return n&&n.startsWith("web_")?"Επισκέπτης site":"+"+n;}
function chanIcon(c){return c==="web"?"🌐":"💬";}
function relTime(iso){
  const d=new Date(iso),now=new Date(),s=(now-d)/1000;
  if(s<60)return"μόλις τώρα";if(s<3600)return"πριν "+Math.floor(s/60)+"′";
  if(s<86400&&now.getDate()===d.getDate())return d.toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});
  if(s<172800)return"χθες";return d.toLocaleDateString("el-GR",{day:"2-digit",month:"2-digit"});
}
function clockTime(iso){return new Date(iso).toLocaleTimeString("el-GR",{hour:"2-digit",minute:"2-digit"});}

function setFilter(f){filter=f;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("active",c.dataset.f===f));renderList();}

function openList(){show("listView");loadList();clearInterval(listTimer);listTimer=setInterval(loadList,5000);clearInterval(chatTimer);}
async function loadList(){
  try{const d=await api("?action=conversations");allConvos=d.conversations||[];
    const tot=document.getElementById("unreadTotal");
    if(d.totalUnread>0){tot.textContent=d.totalUnread;tot.classList.remove("hidden");}else tot.classList.add("hidden");
    renderList();
  }catch{}
}
function renderList(){
  const q=(document.getElementById("search").value||"").toLowerCase().trim();
  let items=allConvos.slice();
  if(filter==="wa")items=items.filter(c=>c.channel==="wa");
  else if(filter==="web")items=items.filter(c=>c.channel==="web");
  else if(filter==="unread")items=items.filter(c=>c.unread>0);
  else if(filter==="closed")items=items.filter(c=>c.tag==="closed");
  if(q)items=items.filter(c=>(fmtNum(c.wa_id).toLowerCase().includes(q))||(c.last||"").toLowerCase().includes(q));
  const el=document.getElementById("list");
  if(!items.length){el.innerHTML='<div class="empty"><div class="ico">💬</div>Καμία συνομιλία.</div>';return;}
  el.innerHTML=items.map(c=>{
    let tagPill="";
    if(c.tag==="closed")tagPill='<span class="pill pill-closed">✓ κλείστηκε</span>';
    else if(c.tag==="important")tagPill='<span class="pill pill-important">⭐ σημαντική</span>';
    const paused=c.paused?'<span class="pill pill-paused"><span class="pulse"></span>εσύ</span>':'';
    const unread=c.unread>0?`<span class="unread">${c.unread}</span>`:'';
    return `<div class="conv" onclick="openChat('${c.wa_id}')">
      <div class="avatar">${chanIcon(c.channel)}</div>
      <div class="meta"><div class="num">${escapeHtml(fmtNum(c.wa_id))}${tagPill}${paused}</div>
        <div class="prev">${escapeHtml(c.last)}</div></div>
      <div class="right"><span class="time">${relTime(c.at)}</span>${unread}</div>
    </div>`;
  }).join("");
}

async function openChat(waId){
  current=waId;document.getElementById("chatTitle").textContent=(waId.startsWith("web_")?"🌐 ":"💬 ")+fmtNum(waId);
  show("chatView");await loadChat();
  try{await api("",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"markread",wa_id:waId})});}catch{}
  clearInterval(listTimer);clearInterval(chatTimer);chatTimer=setInterval(loadChat,4000);
}
async function loadChat(){
  try{const d=await api("?action=messages&wa_id="+encodeURIComponent(current));
    if(d.state)curState=d.state;renderToggle();
    const el=document.getElementById("msgs");const atBottom=el.scrollHeight-el.scrollTop-el.clientHeight<80;
    el.innerHTML=(d.messages||[]).map(m=>`<div class="msg-row ${m.role==='user'?'user':'assistant'}"><div class="bubble">${escapeHtml(m.content)}</div><div class="stamp">${clockTime(m.created_at)}</div></div>`).join("");
    if(atBottom)window.scrollTo(0,document.body.scrollHeight);
  }catch{}
}
function renderToggle(){
  const b=document.getElementById("aiToggle"),s=document.getElementById("statusLine");
  const off=curState.ai_enabled===false,wp=curState.paused_until&&new Date(curState.paused_until)>new Date();
  if(off){b.textContent="▶ Ξεκίνα AI";b.className="ai-toggle on";s.className="statusline frozen";s.innerHTML='<span class="dot"></span>AI σβηστό — απαντάς εσύ';}
  else if(wp){b.textContent="⏸ Απαντάω εγώ";b.className="ai-toggle off";s.className="statusline frozen";s.innerHTML='<span class="dot"></span>AI σε παύση 12ω';}
  else{b.textContent="⏸ Απαντάω εγώ";b.className="ai-toggle off";s.className="statusline active";s.innerHTML='<span class="dot"></span>AI ενεργό';}
  ["open","closed","important"].forEach(t=>{const el=document.getElementById("tag"+t.charAt(0).toUpperCase()+t.slice(1));if(el)el.classList.toggle("active",(curState.tag||"open")===t);});
}
async function toggleAI(){
  const ne=curState.ai_enabled===false;const b=document.getElementById("aiToggle");b.disabled=true;
  try{await api("",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"toggle",wa_id:current,ai_enabled:ne})});
    curState.ai_enabled=ne;if(ne)curState.paused_until=null;renderToggle();}catch{}
  b.disabled=false;
}
async function setTag(tag){
  try{await api("",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"tag",wa_id:current,tag})});
    curState.tag=tag;renderToggle();}catch{}
}
async function delChat(){
  if(!confirm("Σίγουρα θες να διαγράψεις οριστικά αυτή τη συνομιλία; Δεν αναιρείται."))return;
  try{await api("",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"delete",wa_id:current})});closeChat();}catch{}
}
function closeChat(){current=null;openList();}
async function sendReply(){
  const ta=document.getElementById("reply"),text=ta.value.trim();if(!text||!current)return;
  const btn=document.getElementById("sendBtn");btn.disabled=true;
  try{await api("",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"send",wa_id:current,text})});ta.value="";autosize(ta);await loadChat();window.scrollTo(0,document.body.scrollHeight);}catch{}
  btn.disabled=false;
}
document.getElementById("reply").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendReply();}});
function escapeHtml(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

if(KEY)openList();else show("login");
</script>
</body>
</html>
